# Render Blueprint — deploys the API + Postgres database together.
# In Render: New → Blueprint → connect your repo → this file is auto-detected.

services:
  - type: web
    name: nedlo-stokvel-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nedlo-stokvel-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TREASURER_PASSWORD
        sync: false
      - key: FINSEC_PASSWORD
        sync: false
      - key: RECSEC_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: nedlo-stokvel-db
    plan: free
